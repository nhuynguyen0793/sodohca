<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chỉ đường khuôn viên</title>
<meta name="description" content="Bản đồ 3D chỉ đường trong khuôn viên, dùng được cả khi không có mạng.">
<meta name="theme-color" content="#0b1413">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chỉ đường">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1413;--card:#13211f;--card2:#1a2c29;--line:#2a4440;--ink:#e9f3f0;--mut:#93aaa4;--glow:#c8ff2e;--cy:#35e0c9;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Be Vietnam Pro",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.row:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
#top{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--card);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:1fr 46px;box-shadow:0 8px 30px #0008;max-width:520px;margin:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:48px;cursor:pointer;min-width:0}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row+.row{border-top:1px solid var(--line)}
.ph{color:var(--mut)}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.loc{flex:none;margin:0 -2px;filter:drop-shadow(0 0 4px #35e0c966)}.db{background:var(--glow);box-shadow:0 0 10px var(--glow)}
#brs{background:var(--glow)!important;color:#10200a;border-color:var(--glow)!important;box-shadow:0 0 14px #c8ff2e66}
#brs .hm{font-size:24px;line-height:1}
#swap{grid-row:1/3;grid-column:2;border-left:1px solid var(--line);font-size:20px;color:var(--mut)}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--glow);color:#10200a;border-color:var(--glow)}
#tools{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 118px);display:flex;flex-direction:column;gap:6px}
#tools button{width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 14px);max-height:46vh;overflow:auto;transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px #000a;max-width:560px;margin:auto}
#sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.hd{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.big{font-size:24px;font-weight:700;letter-spacing:-.01em}
.big small{font-size:14px;font-weight:500;color:var(--mut);margin-left:6px}
.sub{color:var(--mut);font-size:13.5px}
.x{width:36px;height:36px;border-radius:50%;background:var(--card2);flex:none}
ol{list-style:none;margin:12px 0 0;padding:0}
ol li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
ol li b{flex:none;min-width:52px;color:var(--glow);font-weight:600}
details{margin-top:10px;font-size:13.5px;color:var(--mut)}summary{cursor:pointer;padding:6px 0;color:var(--ink)}
code{display:block;background:var(--card2);padding:10px;border-radius:10px;color:var(--ink);font:12.5px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:6px 0}
.btn{padding:11px 16px;border-radius:12px;background:var(--glow);color:#10200a;font-weight:700}
.btn.g{background:var(--card2);color:var(--ink);font-weight:500}
.ovl{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;z-index:5}
.ovl.on{display:flex}
.ovl .bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;max-width:560px;width:100%;margin-inline:auto}
.ovl input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ovl input:focus{outline:2px solid var(--glow);border-color:transparent}
#list{overflow:auto;flex:1;max-width:560px;width:100%;margin-inline:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#list h3{margin:16px 4px 4px;font-size:13px;font-weight:600;color:var(--mut)}
.it{display:block;width:100%;text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);min-height:46px}
.it small{display:block;color:var(--mut);font-size:12.5px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.seg .chip.on{background:var(--glow)}
.res{background:var(--card2);border-radius:14px;padding:14px;margin:6px 0 14px}
.res b{display:block;font-size:18px;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:86%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.on{opacity:1}
</style></head><body>
